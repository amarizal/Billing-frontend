name: billing_pos
description: PS4 & PS5 Rental Billing and POS System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: ^5.7.0
  
  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.2

  # UI Components
  google_fonts: ^6.2.1

  # Date & Time
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

  # Export
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.3
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "../Logo futuristik AF-ONE Play Station.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
