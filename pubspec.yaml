name: billing_pos
description: PS4 & PS5 Rental Billing and POS System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: ^5.7.0
  
  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Notifications (timer alert sesi habis)
  flutter_local_notifications: ^17.2.3

  # Date & Time
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8
  
  # Utils
  uuid: ^4.5.1
  
  # Export
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.3
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "../Logo futuristik AF-ONE Play Station.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
